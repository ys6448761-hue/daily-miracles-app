# DREAMTOWN_MOTION_SAFE.yml
# DreamTown Motion Safe Zone SSOT
# version: 1.1.0 (calibration v2 — 2026-05-23)
# created: 2026-05-23
# purpose: 감정 잔상을 유지하는 최소 motion 임계값 정의
#
# 핵심 원칙:
#   "DreamTown motion의 목표는 이미지를 움직이는 것이 아니라,
#    기억이 살아 있었다는 것을 느끼게 하는 것이다."

meta:
  id: MOTION-SAFE-001
  status: active
  validator: scripts/validateDreamTownMotion.ts

# ─────────────────────────────────────────
# LEVEL DEFINITIONS  (L1 ~ L4 = SAFE ZONE)
# ─────────────────────────────────────────

levels:
  L1:
    name: Whisper
    description: 거의 지각 불가. 이미지가 숨쉬듯 존재.
    zoom_per_sec:       [0.00, 0.30]   # %/s
    pan_per_sec:        [0.00, 0.10]   # %/s
    opacity_range:      [0.00, 2.00]   # delta %
    grain_opacity:      [0.00, 1.50]   # %
    nano_burst_opacity: [0.00, 8.00]   # peak %
    loop_duration_min:  6              # seconds (너무 빠른 반복 금지)

  L2:
    name: Breath
    description: 살아 있다는 감각. 보이지 않되 느껴지는 수준.
    zoom_per_sec:       [0.30, 0.80]
    pan_per_sec:        [0.00, 0.20]
    opacity_range:      [2.00, 5.00]
    grain_opacity:      [1.50, 3.00]
    nano_burst_opacity: [8.00, 12.00]
    loop_duration_min:  5

  MID_SAFE:
    name: MidBreath
    description: |
      L2와 L3 사이 calibration 구간. "살아 있는 공기감" 감지 임계.
      pan 없음. 영상 느낌 금지. static 감각 유지.
      — Calibration v2에서 추가.
    zoom_per_sec:       [0.70, 1.00]
    pan_per_sec:        [0.00, 0.25]
    opacity_range:      [2.00, 6.00]
    grain_opacity:      [2.00, 3.50]
    nano_burst_opacity: [8.00, 14.00]
    loop_duration_min:  5

  L3:
    name: Pulse
    description: 느껴지되 보이지 않는 수준. 감정 잔상 강화.
    zoom_per_sec:       [1.00, 1.50]
    pan_per_sec:        [0.20, 0.40]
    opacity_range:      [5.00, 10.00]
    grain_opacity:      [3.00, 5.00]
    nano_burst_count:   [1, 3]          # per burst event
    nano_burst_opacity: [12.00, 18.00]
    nano_burst_duration: [0.25, 0.50]   # seconds
    loop_duration_min:  4

  L4:
    name: Echo
    description: 기억에 남는 인상. SAFE ZONE 최대치.
    zoom_per_sec:       [1.50, 2.00]
    pan_per_sec:        [0.40, 0.60]
    opacity_range:      [10.00, 15.00]
    grain_opacity:      [5.00, 7.00]
    nano_burst_count:   [3, 5]
    nano_burst_opacity: [18.00, 22.00]
    nano_burst_duration: [0.40, 0.60]
    loop_duration_min:  3

# ─────────────────────────────────────────
# DRIFT THRESHOLD  (경고 → 실패 기준)
# ─────────────────────────────────────────

drift:
  description: L4를 초과하면 DRIFT. 연출이 보이기 시작하는 임계.
  zoom_per_sec_max:       2.00    # 이 이상 = DRIFT
  pan_per_sec_max:        0.60
  opacity_range_max:      15.00
  grain_opacity_max:      7.00
  nano_burst_count_max:   5
  nano_burst_opacity_max: 22.00
  loop_duration_min:      2

  fail_responses:
    - "카메라 무빙 같다"
    - "AI 영상 같다"
    - "연출 티가 난다"
    - "계속 움직여서 피곤하다"

# ─────────────────────────────────────────
# FORBIDDEN MOTION
# ─────────────────────────────────────────

forbidden:
  description: 절대 허용 불가. 1건이라도 감지 시 즉시 FORBIDDEN.
  items:
    - id: F-01
      name: rotation
      description: 회전 transform (rotate, skew 포함)

    - id: F-02
      name: cinematic_camera_move
      description: 빠른 패닝, 달리, 줌인/아웃 시네마틱 속도 (>3%/s)

    - id: F-03
      name: bounce
      description: bouncing / spring 이징

    - id: F-04
      name: lens_flare
      description: 빛 폭발, 렌즈 플레어, 선버스트

    - id: F-05
      name: heavy_particle
      description: 파티클 10개 초과 동시 노출

    - id: F-06
      name: full_ai_video
      description: AI 생성 연속 프레임 재생

    - id: F-07
      name: character_reinterpretation
      description: 캐릭터 얼굴·표정·포즈 변형

    - id: F-08
      name: continuous_emotional_overacting
      description: 쉬지 않고 계속 움직이는 감정 연출 (>20s 연속)

    - id: F-09
      name: easing_bounce_or_elastic
      description: cubic-bezier bounce / elastic 이징 함수

# ─────────────────────────────────────────
# NANO BURST RULES
# ─────────────────────────────────────────

nano_burst:
  description: |
    별빛 잔상 표현용 극소 입자. "폭발"이 아닌 "잔광".
    F5(fragile_hope) / F2(emotional_afterflow)에 우선 적용.

  rules:
    max_simultaneous_particles: 5
    max_opacity_peak:           22.0   # %
    min_fade_duration:          0.25   # seconds
    max_fade_duration:          0.60
    min_delay_from_frame_start: 2.0    # seconds — 갑작스러운 등장 금지 (권장 4s)
    max_size:                   3      # px — v2: 3px 표준 (기존 2px → 3px 상향)
    allowed_shapes:             [circle, soft-circle]
    forbidden_shapes:           [star, polygon, glow-halo]
    placement:
      safe_zones:
        - center                # 시선 집중 영역
        - upper-third           # 하늘 영역
      avoid_zones:
        - subject_face          # 인물 얼굴 영역
        - text_overlap          # 자막 겹침 금지

  fires_once:
    rule: "fires_once: true 설정 시 반복 금지. 한 번만 발화."
    description: |
      "방금 뭔가 있었나?" 수준 유지.
      반복 시 "움직임" 인식 → 연출 느낌 → DRIFT 위험.

  delay_variants:
    B1_delay_4s_v2:
      delay: 4.0
      size: 3
      fires_once: true
      description: "v2 표준. 여운형. 자막 읽힌 후 등장. 반복 금지."
    B2_delay_3s:
      delay: 3.0
      description: "반응형. 자막과 거의 동시 등장."

# ─────────────────────────────────────────
# GRAIN RULES
# ─────────────────────────────────────────

grain:
  description: |
    필름 그레인 느낌. "오래된 기억" 텍스처 부여.
    CSS noise 기반. GPU 영향 최소화.

  rules:
    max_opacity:      7.0    # %
    max_size:         3      # px — 더 크면 패턴이 보임
    min_loop:         0.8    # seconds
    blend_mode:       overlay
    forbidden_modes:  [screen, hard-light]
    layer_position:   above_image_below_subtitle

  calibration_variants:
    C1_standard:
      opacity: 2.0
      size: 2       # px
      description: "기준값. 필름 느낌 최소."
    C2_fine:
      opacity: 1.5
      size: 1       # px
      description: "초미세. 텍스처 인지 경계선."

# ─────────────────────────────────────────
# PLACEMENT RULES  (D variant 기준)
# ─────────────────────────────────────────

placement:
  description: |
    효과는 시선 중심(center)과 상단 1/3(upper-third)에 집중.
    가장자리 burst는 "시각 소음"으로 처리.

  focus_zone:
    area: center
    description: "주시선 영역. burst/shimmer 최우선 배치."
    center_weight: 0.7      # 전체 burst의 70%를 이 영역에

  secondary_zone:
    area: upper-third
    center_weight: 0.3

  avoid:
    - lower-edge
    - corner
    - subtitle-overlap

  variants:
    D1_center_burst:
      description: "burst 100% 중심 집중. 시선 고정 효과."
      center_weight: 1.0
      size_multiplier: 0.8   # 작게 — 과하지 않게

# ─────────────────────────────────────────
# GPU TARGET
# ─────────────────────────────────────────

performance:
  gpu_average_max:    15.0   # %
  gpu_peak_max:       30.0   # % (burst 순간)
  frame_budget_ms:    16.7   # 60fps
  rAF_transforms_max: 3      # 동시 JS transform 최대

# ─────────────────────────────────────────
# VALIDATOR OUTPUT
# ─────────────────────────────────────────

validator:
  outputs:
    SAFE:      "모든 L1–L4 범위 이내. 감정 잔상 강화 허용."
    WARNING:   "L4 상한 근접 (80–100%). 조정 권장."
    DRIFT:     "L4 초과. 연출이 보이기 시작함. 즉시 수정."
    FORBIDDEN: "금지 효과 감지. 즉시 제거."

  thresholds:
    warning_pct: 80    # L4 상한의 80% 이상이면 WARNING
